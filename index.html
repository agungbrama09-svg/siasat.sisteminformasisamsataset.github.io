<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - Titik Senja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #2d1e18;
            --accent: #d48331;
            --accent-hover: #b86d22;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #777777;
            --border: #f0eae1;
            --shadow: 0 10px 30px rgba(45, 30, 24, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        .container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; padding: 12px; gap: 16px; flex: 1; }
        
        .sidebar { background: var(--card-bg); border: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; border-radius: 16px; box-shadow: var(--shadow); }
        .main-content { display: flex; flex-direction: column; gap: 16px; flex: 1; }
        
        .brand-header { margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 38px; height: 38px; background: linear-gradient(135deg, #d48331, #a35211); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(212, 131, 49, 0.3); }
        .brand-header h1 { font-size: 1.2rem; color: var(--primary); font-weight: 700; letter-spacing: 0.5px; }
        .brand-header p { font-size: 0.75rem; color: var(--text-muted); }

        h2 { font-size: 0.95rem; margin-bottom: 10px; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .menu-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .menu-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.20s ease; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .menu-card:active { transform: scale(0.96); background: #faf8f5; }
        .menu-card h4 { font-size: 0.85rem; margin: 6px 0 2px; color: var(--primary); font-weight: 600; }
        .menu-card span.price { font-size: 0.8rem; color: var(--accent); font-weight: 600; }
        
        .cart-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; padding-right: 4px; display: flex; flex-direction: column; gap: 6px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #faf8f5; border-radius: 8px; border: 1px solid var(--border); font-size: 0.8rem; }
        .cart-item button { background: #ff5252; color: white; border: none; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .cart-item button.plus { background: var(--accent); }
        
        .total-section { font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 12px; background: #faf8f5; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); color: var(--primary); }
        
        .btn-pay { background: linear-gradient(135deg, var(--accent), #b86d22); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(212, 131, 49, 0.3); }
        
        .rekap-container { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .rekap-header-info { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .date-badge { background: #faf8f5; padding: 4px 10px; border-radius: 6px; font-weight: 600; color: var(--primary); border: 1px solid var(--border); font-size: 0.75rem; width: fit-content; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.8rem; }
        table th, table td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
        table th { background-color: #faf8f5; color: var(--primary); font-weight: 600; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: #faf8f5; color: var(--text-muted); border: 1px solid var(--border); }
        
        .btn-danger { background: #fff2f2; color: #ff5252; border: 1px solid #ffd6d6; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 500; }

        @media (min-width: 768px) {
            body { height: 100vh; overflow: hidden; }
            .container { flex-direction: row; height: 100vh; padding: 16px; }
            .sidebar { width: 380px; height: 100%; }
            .main-content { height: 100%; overflow-y: auto; padding-right: 4px; }
            .menu-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .rekap-header-info { flex-direction: row; justify-content: space-between; align-items: center; }
            .cart-list { max-height: none; flex: 1; }
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e0d6cc; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar Kasir -->
        <div class="sidebar">
            <div class="brand-header">
                <div class="brand-logo">TS</div>
                <div>
                    <h1>Titik Senja</h1>
                    <p>Coffee & Space</p>
                </div>
            </div>
            <h2>Keranjang Pesanan</h2>
            <div class="cart-list" id="cartList">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 20px;">Belum ada pesanan dipilih</p>
            </div>
            <div class="total-section">
                <span>Total Bayar:</span>
                <span id="totalHarga" style="color: var(--accent);">Rp 0</span>
            </div>
            <button class="btn-pay" onclick="prosesBayar()">Proses Pembayaran (1 Pembeli)</button>
        </div>

        <!-- Konten Utama: Pilih Menu & Pembukuan -->
        <div class="main-content">
            <div>
                <h2>Daftar Menu</h2>
                <div class="menu-container" id="menuContainer"></div>
            </div>

            <div class="rekap-container">
                <div class="rekap-header-info">
                    <h2>Riwayat Belanja per Pembeli</h2>
                    <div class="date-badge" id="liveDateBadge">Memuat tanggal...</div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">
                    <span style="font-size: 0.85rem; font-weight: 500;">Total Pendapatan: <strong id="totalPendapatan" style="color: #2e7d32; font-size: 1rem;">Rp 0</strong></span>
                    <button class="btn-danger" onclick="resetRekap()">Hapus Semua Riwayat</button>
                </div>

                <div style="overflow-x: auto; max-height: 250px;">
                    <table>
                        <thead>
                            <tr>
                                <th>No / Waktu</th>
                                <th>Hari & Tanggal</th>
                                <th>Daftar Belanjaan Pembeli</th>
                                <th>Total Bayar</th>
                            </tr>
                        </thead>
                        <tbody id="rekapTableBody">
                            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Belum ada riwayat transaksi</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menus = [
            { id: 1, nama: 'Cappuccino', kategori: 'Es Kopi', harga: 15000 },
            { id: 2, nama: 'Caramel Macchiato', kategori: 'Es Kopi', harga: 15000 },
            { id: 3, nama: 'Kopi Gula Aren', kategori: 'Es Kopi', harga: 15000 },
            { id: 4, nama: 'Matcha Latte', kategori: 'Non Kopi', harga: 15000 },
            { id: 5, nama: 'Taro Latte', kategori: 'Non Kopi', harga: 15000 },
            { id: 6, nama: 'Coklat', kategori: 'Non Kopi', harga: 15000 },
            { id: 7, nama: 'Red Velvet', kategori: 'Non Kopi', harga: 15000 },
            { id: 8, nama: 'Roti Bakar', kategori: 'Makanan', harga: 10000 },
            { id: 9, nama: 'Mix Platter', kategori: 'Makanan', harga: 10000 },
            { id: 10, nama: 'Pop Mie', kategori: 'Makanan', harga: 8000 },
            { id: 11, nama: 'Mie Biasa', kategori: 'Makanan', harga: 8000 }
        ];

        function getFormattedDate(date = new Date()) {
            try {
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                return date.toLocaleDateString('id-ID', options);
            } catch (e) {
                return 'Kamis, 10 September 2026';
            }
        }

        function getTimeString(date = new Date()) {
            try {
                return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '11:00';
            }
        }

        // Jalankan saat elemen siap
        window.onload = function() {
            const dateBadge = document.getElementById('liveDateBadge');
            if (dateBadge) {
                dateBadge.innerText = getFormattedDate();
            }
            inisialisasiMenu();
            renderRekap();
        };

        let cart = [];
        let riwayatTransaksi = [];
        
        try {
            riwayatTransaksi = JSON.parse(localStorage.getItem('titik_senja_riwayat')) || [];
        } catch (e) {
            riwayatTransaksi = [];
        }

        function inisialisasiMenu() {
            const menuContainer = document.getElementById('menuContainer');
            if (!menuContainer) return;
            
            menuContainer.innerHTML = '';
            menus.forEach(menu => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.onclick = () => tambahKeKeranjang(menu);
                card.innerHTML = `
                    <span class="badge">${menu.kategori}</span>
                    <h4>${menu.nama}</h4>
                    <span class="price">Rp ${menu.harga.toLocaleString('id-ID')}</span>
                `;
                menuContainer.appendChild(card);
            });
        }

        function tambahKeKeranjang(menu) {
            const existing = cart.find(item => item.id === menu.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...menu, qty: 1 });
            }
            renderCart();
        }

        function ubahQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            const totalHargaEl = document.getElementById('totalHarga');
            
            if (!cartList || !totalHargaEl) return;

            if (cart.length === 0) {
                cartList.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 20px;">Belum ada pesanan dipilih</p>`;
                totalHargaEl.innerText = 'Rp 0';
                return;
            }

            cartList.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.harga * item.qty;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div style="flex: 1;">
                        <strong>${item.nama}</strong><br>
                        <small style="color: var(--text-muted);">Rp ${item.harga.toLocaleString('id-ID')}</small>
                    </div>
                    <div style="display: flex; gap: 6px; align-items: center;">
                        <button onclick="ubahQty(${item.id}, -1)">-</button>
                        <span style="font-weight: 600; width: 18px; text-align: center;">${item.qty}</span>
                        <button class="plus" onclick="ubahQty(${item.id}, 1)">+</button>
                    </div>
                `;
                cartList.appendChild(div);
            });

            totalHargaEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function prosesBayar() {
            if (cart.length === 0) {
                alert('Keranjang masih kosong!');
                return;
            }

            const now = new Date();
            let totalBelanja = 0;
            let itemsPembeli = cart.map(item => {
                let subtotal = item.harga * item.qty;
                totalBelanja += subtotal;
                return {
                    nama: item.nama,
                    qty: item.qty,
                    subtotal: subtotal
                };
            });

            const transaksiBaru = {
                waktu: getTimeString(now),
                tanggal: getFormattedDate(now),
                items: itemsPembeli,
                total: totalBelanja
            };

            riwayatTransaksi.unshift(transaksiBaru);

            try {
                localStorage.setItem('titik_senja_riwayat', JSON.stringify(riwayatTransaksi));
            } catch (e) {
                console.error("Gagal menyimpan ke penyimpanan HP");
            }

            alert('Pembayaran berhasil! Daftar belanja pembeli telah dicatat.');
            cart = [];
            renderCart();
            renderRekap();
        }

        function renderRekap() {
            const tbody = document.getElementById('rekapTableBody');
            const totalPendapatanEl = document.getElementById('totalPendapatan');
            
            if (!tbody || !totalPendapatanEl) return;
            
            tbody.innerHTML = '';

            let grandTotalSemua = 0;

            if (riwayatTransaksi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Belum ada riwayat transaksi</td></tr>`;
                totalPendapatanEl.innerText = 'Rp 0';
                return;
            }

            riwayatTransaksi.forEach((trx, index) => {
                grandTotalSemua += trx.total;

                let rincianHtml = '<ul style="padding-left: 14px; margin: 0;">';
                trx.items.forEach(i => {
                    rincianHtml += `<li><b>${i.qty}x</b> ${i.nama} (Rp ${i.subtotal.toLocaleString('id-ID')})</li>`;
                });
                rincianHtml += '</ul>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge" style="background:#faf8f5;">#${riwayatTransaksi.length - index}</span><br><small style="color:var(--text-muted);">${trx.waktu}</small></td>
                    <td><span style="font-size: 0.75rem; font-weight: 500;">${trx.tanggal}</span></td>
                    <td>${rincianHtml}</td>
                    <td style="font-weight: 600; color: #2e7d32; white-space: nowrap;">Rp ${trx.total.toLocaleString('id-ID')}</td>
                `;
                tbody.appendChild(tr);
            });

            totalPendapatanEl.innerText = `Rp ${grandTotalSemua.toLocaleString('id-ID')}`;
        }

        function resetRekap() {
            if (confirm('Yakin ingin menghapus seluruh riwayat transaksi pembeli?')) {
                riwayatTransaksi = [];
                try {
                    localStorage.removeItem('titik_senja_riwayat');
                } catch (e) {}
                renderRekap();
            }
        }
    </script>
</body>
</html>
